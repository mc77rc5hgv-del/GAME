name: Avito monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: avito-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r avito_monitor/requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python avito_monitor/monitor.py

      - name: Persist state
        run: |
          git config user.name "avito-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add avito_monitor/state
          git diff --cached --quiet || git commit -m "Update Avito monitor state [skip ci]"
          git push
